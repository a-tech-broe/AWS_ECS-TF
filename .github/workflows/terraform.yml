name: terraform

# Pull requests get validation and a plan posted as a comment. Applies happen
# only from main, through a GitHub Environment so they can require approval.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        required: true
        type: choice
        options: [shared, dev, staging, prod]

permissions:
  contents: read
  id-token: write # required for OIDC role assumption
  pull-requests: write

env:
  TF_VERSION: "1.14.3"
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --- Is this repository bootstrapped yet? -----------------------------------
  #
  # The CI roles are created by `envs/shared`, so on a fresh repository they do
  # not exist and AWS_PLAN_ROLE_ARN / AWS_APPLY_ROLE_ARN are unset. Detect that
  # explicitly and skip the AWS jobs, rather than letting them fail deep inside
  # the credentials action with "Could not load credentials from any providers".
  # fmt/validate/lint/security still run, so a pull request is never unchecked.
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      aws_configured: ${{ steps.check.outputs.aws_configured }}
    steps:
      - id: check
        env:
          PLAN_ROLE: ${{ vars.AWS_PLAN_ROLE_ARN }}
          APPLY_ROLE: ${{ vars.AWS_APPLY_ROLE_ARN }}
        run: |
          if [[ -n "$PLAN_ROLE" && -n "$APPLY_ROLE" ]]; then
            echo "aws_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "aws_configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Terraform: AWS jobs skipped"
              echo ""
              echo "\`AWS_PLAN_ROLE_ARN\` and/or \`AWS_APPLY_ROLE_ARN\` are not set, so"
              echo "there is no role for GitHub to assume and plan/apply cannot run."
              echo ""
              echo "To finish bootstrapping:"
              echo "1. \`cd bootstrap && terraform init && terraform apply\`"
              echo "2. Put the \`backend_hcl\` output into each \`envs/*/backend.hcl\`."
              echo "3. Set \`github_subjects\` in \`envs/shared/terraform.tfvars\`, then"
              echo "   apply \`envs/shared\` locally — it creates the two CI roles."
              echo "4. Save its \`github_plan_role_arn\` / \`github_apply_role_arn\` outputs"
              echo "   as repository **variables** \`AWS_PLAN_ROLE_ARN\` / \`AWS_APPLY_ROLE_ARN\`."
              echo ""
              echo "Static checks (fmt, validate, tflint, Checkov, Trivy) ran normally."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=AWS jobs skipped::CI roles are not configured yet; see the job summary for bootstrap steps."
          fi

  # --- Repository-wide static checks -----------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -recursive -check -diff .

      - name: Validate every module and environment
        run: |
          set -euo pipefail
          for d in modules/*/ envs/*/ bootstrap/; do
            echo "::group::validate $d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --config="$(pwd)/.tflint.hcl"

  # --- Static security analysis ----------------------------------------------
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          config_file: .checkov.yaml
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: false

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov

      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  # --- Plan on pull requests --------------------------------------------------
  plan:
    name: plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: [preflight, lint, security]
    if: github.event_name == 'pull_request' && needs.preflight.outputs.aws_configured == 'true'
    strategy:
      fail-fast: false
      matrix:
        environment: [shared, dev, staging, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Assume the read-only plan role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-plan-${{ matrix.environment }}

      - name: Init
        working-directory: envs/${{ matrix.environment }}
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Plan
        id: plan
        working-directory: envs/${{ matrix.environment }}
        run: |
          set +e
          terraform plan -input=false -lock-timeout=5m -no-color -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          # Keep the comment under GitHub's 65535-character limit.
          tail -c 60000 plan.txt > plan.trimmed
          exit $code

      - name: Comment plan on the pull request
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const env = '${{ matrix.environment }}';
            const marker = `<!-- tf-plan-${env} -->`;
            let body;
            try {
              body = fs.readFileSync('envs/' + env + '/plan.trimmed', 'utf8');
            } catch (e) {
              body = 'Plan produced no output.';
            }
            const comment = `${marker}\n### Terraform plan — \`${env}\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`terraform\n${body}\n\`\`\`\n\n</details>`;
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const existing = await github.rest.issues.listComments({owner, repo, issue_number});
            const mine = existing.data.find(c => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({owner, repo, comment_id: mine.id, body: comment});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body: comment});
            }

  # --- Apply from main --------------------------------------------------------
  apply:
    name: apply (${{ inputs.environment || matrix.environment }})
    runs-on: ubuntu-latest
    needs: [preflight, lint, security]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.preflight.outputs.aws_configured == 'true'
    strategy:
      # Sequential: shared owns ECR and the CI roles the others depend on, and
      # prod must never apply before staging has proved the change.
      max-parallel: 1
      fail-fast: true
      matrix:
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.environment)) || fromJSON('["shared","dev","staging","prod"]') }}
    environment: ${{ matrix.environment }} # gate prod behind a required reviewer here
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Assume the apply role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-apply-${{ matrix.environment }}

      - name: Init
        working-directory: envs/${{ matrix.environment }}
        run: terraform init -input=false -backend-config=backend.hcl

      # Plan and apply the same artifact, so what was reviewed is what runs.
      - name: Plan
        working-directory: envs/${{ matrix.environment }}
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Apply
        working-directory: envs/${{ matrix.environment }}
        run: terraform apply -input=false -lock-timeout=5m tfplan
